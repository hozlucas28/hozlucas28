          - Developed **+90** repositories (**+4,600**
            contributions) and created **+230** pull requests on GitHub, applying
            algorithms and data structures in Go, TypeScript, and Python, sharing my knowledge with the community.
          - Incorporated AI-assisted development tools into my
            workflow to accelerate the software development lifecycle
            (SDLC), earning certifications in their use and continuously training myself.
          - Wrote **6** technical articles on preventing supply
            chain attacks, scalable systems, SOLID principles,
            design patterns, CI/CD, and DevContainers, implementing these practices in my day-to-day work.
      - position: Software Engineer
        company: FCLA
        start_date: 2020-11
        end_date: 2022-04
        highlights:
          - Reduced technical debt and sustained server stability under
            high concurrency by leading a team of **8** developers
            through quality standards and a code review process.
          - Raised the team's technical level by training **8**
            developers from different countries in Git, GitHub, and SQF,
            professionalizing the workflow of the entire team.
          - Sustained server fluidity under high demand by diagnosing and
            resolving performance bottlenecks in the C++ and SQF stack, mitigating client-to-server synchronization failures.
      - position: Full Stack Developer
        company: FCLA
        start_date: 2019-10
        end_date: 2020-11
        highlights:
          - Reduced team integration times by
            introducing Git and GitHub as version control tools,
            replacing manual file management and improving communication between departments.
          - Launched new projects and features by participating in weekly
            sprints under agile methodologies, collaborating with designers and
            developers to achieve the goals set for each sprint.
    Projects:
      - name: "[IoT Stock Control and Security System Integrated with an Android Application](https://github.com/hozlucas28/SOA-Practical-Work-2026)"
        date: 2026-07
        summary: System for businesses that replaces manual inventory counts with real-time monitoring, using an ESP32 that detects weight variations and reports them via MQTT and Node-RED to an Android application.
      - name: "[Data Analysis Automation with Scripting](https://github.com/hozlucas28/APL-Practical-Work-2025)"
        date: 2025-09
        summary: Bash and PowerShell scripts that analyze surveys, optimize transportation routes, and process system logs, consuming an external API with local caching and incorporating a daemon process that audits Git repositories.
      - name: "[Crafting System with Testing and Design Patterns](https://github.com/hozlucas28/Java-Practical-Work-2025)"
        date: 2025-07
        summary: Crafting system developed in Java that models extensible hierarchical objects using the Builder and Composite patterns, with a logical reasoning layer in Prolog and full unit and E2E test coverage in JUnit.
      - name: "[Tic-Tac-Toe with Artificial Intelligence](https://github.com/hozlucas28/C-Algorithms-Practical-Work-2025)"
        date: 2025-02
        summary: Low-level Tic-Tac-Toe engine developed in C, with an AI opponent and advanced data structures, manually managing dynamic memory and integrating an external API to persist data.
      - name: "[Conway's Game of Life Simulation](https://github.com/hozlucas28/C-Practical-Work-2024)"
        date: 2024-10
        summary: Recreation of Conway's Game of Life developed in C, with real-time rendering built on SDL, an argument-configurable grid with dynamic memory management, and a responsive interface.
      - name: "[Pokémon Card Generator](https://pokemon-cards-ochre.vercel.app/)"
        date: 2023-05
        summary: React web application that consumes the PokéAPI to collect cards, persisting results in browser local storage, with navigation via React Router, live notifications, and responsive design.
      - name: "[Admin Panel for Managing a Supermarket](https://github.com/hozlucas28/Codo-Codo-Back-end-Project-2022)"
        date: 2022-12
        summary: Panel that digitizes the previously manual management of a supermarket, through a full CRUD in JSP and MySQL for employees and products, with dynamic search filters, Bootstrap notifications, and form validation.
