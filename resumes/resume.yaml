  sections:
    Professional profile:
      - "**Full Stack Software Engineer with +4 years** of professional experience
        and self-taught development in Go, Node.js, and React. I design scalable
        backend systems applying Clean Architecture, TDD, and SOLID, integrating
        GenAI into my daily workflow to accelerate the software development
        lifecycle. I also contribute to Mercado Libre's open source projects."
    Notable achievements:
      - bullet: "**Contributions to Mercado Libre:** Reduced technical risk on Mercado Libre projects, getting 7 of 14 pull requests merged by their engineering teams, by proactively detecting and proposing security initiatives."
      - bullet: "**Technical leadership**: Led a team of 8 developers
          establishing code review standards, reducing technical debt,
          and sustaining server stability under high request concurrency."
      - bullet: "**Open source contributions**: Developed +90 repositories (+4,600 contributions) and created +230 pull requests, contributing to the dissemination and maintenance of open source code."
      - bullet: "**Technical outreach**: Published 6 technical articles on
          scalable systems, design patterns, CI/CD, and security,
          sharing my knowledge with the community of software architects and developers."
      - bullet: '**Problem solving**: Reached 5th place among +1,300
          developers in the "Programming Challenges" roadmap and earned the
          platinum badge in Advent of TypeScript (2 consecutive years),
          reflecting my consistency and technical mastery.'
      - bullet: "**International training**: Trained 8 developers in
          Git, GitHub, and SQF, closing the technical knowledge gap and
          professionalizing the workflow on an international team."
    Experience:
      - position: Software Developer
        company: Self-Taught Development & Open Source
        start_date: 2022-04
        summary: "Intensive training period alongside my Computer Engineering
          degree. Focused on deepening my knowledge of scalable backend
          architectures, design patterns, and TDD, earning certifications and
          contributing to open source projects."
        highlights:
          - Reduced technical risk on Mercado Libre projects,
