          - Reduje la deuda técnica y sostuve la estabilidad del servidor frente a una alta concurrencia de peticiones, liderando un equipo de 8 desarrolladores mediante estándares de calidad y un proceso de code review.
          - Elevé el nivel técnico del equipo mediante la capacitación de 8 desarrolladores internacionales en Git, GitHub y SQF, profesionalizando así el flujo de trabajo.
          - Aseguré el rendimiento y la estabilidad del servidor al resolver cuellos de botella en C++ y SQF, mitigando las fallas de sincronización entre el cliente y el servidor.
