    Perfil profesional:
      - "**Software Engineer FullStack con +4 años** de experiencia profesional y desarrollo autodidacta en Go, Node.js y React. Diseño sistemas backend escalables aplicando Clean Architecture, TDD y SOLID, integrando GenAI en mi flujo diario para acelerar el ciclo de vida del desarrollo de software. Además, he contribuido a proyectos open source de Mercado Libre."
    Logros destacables:
      - bullet: "**Contribuciones a Mercado Libre:** Reduje los riesgos técnicos en proyectos de Mercado Libre, logrando que 7 de 14 pull requests fueran integradas por sus equipos de ingeniería, al detectar y proponer proactivamente iniciativas de seguridad."
      - bullet: "**Liderazgo técnico**: Lideré un equipo de 8 desarrolladores mediante la definición de estándares de code review, lo que permitió reducir la deuda técnica y mantener la estabilidad del servidor frente a una alta concurrencia de peticiones."
      - bullet: "**Contribuciones open source**: Desarrollé +90 repositorios (+4.600 contribuciones) y creé +230 pull requests en GitHub, divulgando y manteniendo código open source."
      - bullet: "**Divulgación técnica**: Publiqué 6 artículos técnicos sobre sistemas escalables, patrones de diseño, CI/CD y seguridad, compartiendo mis conocimientos con la comunidad de arquitectos de software y desarrolladores."
      - bullet: '**Resolución de problemas**: Alcancé el 5to puesto entre +1.300 desarrolladores en el roadmap "Retos de Programación" y obtuve la insignia de platino en el Advent of TypeScript (2 años consecutivos), reflejando mi constancia y dominio técnico.'
      - bullet: "**Capacitación internacional**: Formé a 8 desarrolladores en Git, GitHub y SQF, reduciendo la brecha técnica y estandarizando los flujos de trabajo del equipo."
