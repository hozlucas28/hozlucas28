    Proyectos:
      - name: "[Sistema IoT de Control de Stock y Seguridad Integrado con una Aplicación Android](https://github.com/hozlucas28/SOA-Practical-Work-2026)"
        date: 2026-07
        summary: Sistema para comercios que sustituye los conteos manuales de inventario por monitoreo en tiempo real, con una ESP32 que detecta variaciones de peso y las notifica vía MQTT y Node-RED a una aplicación Android.
      - name: "[Automatización de Análisis de Datos con Scripting](https://github.com/hozlucas28/APL-Practical-Work-2025)"
        date: 2025-09
        summary: Scripts en Bash y PowerShell que analizan encuestas, optimizan rutas de transporte, procesan logs del sistema, consumen una API externa con caché local e incorporan un proceso en segundo plano que audita repositorios de Git.
      - name: "[Sistema de Crafteo con Testing y Patrones de Diseño](https://github.com/hozlucas28/Java-Practical-Work-2025)"
        date: 2025-07
        summary: Sistema de crafteo desarrollado en Java que modela objetos jerárquicos extensibles mediante patrones Builder y Composite, con una capa de razonamiento lógico en Prolog y cobertura completa de pruebas unitarias y E2E en JUnit.
      - name: "[Tatetí con Inteligencia Artificial](https://github.com/hozlucas28/C-Algorithms-Practical-Work-2025)"
        date: 2025-02
        summary: Motor de Tatetí de bajo nivel desarrollado en C con una IA como oponente y estructuras de datos avanzadas, que gestiona la memoria dinámica manualmente e integra una API externa para persistir los datos.
      - name: "[Simulación del Juego de la Vida de Conway](https://github.com/hozlucas28/C-Practical-Work-2024)"
        date: 2024-10
        summary: Recreación del Juego de la Vida de Conway desarrollada en C, con un renderizado en tiempo real construido sobre SDL, una grilla configurable por argumentos con manejo de memoria dinámica y una interfaz responsiva.
      - name: "[Generador de Cartas Pokémon](https://pokemon-cards-ochre.vercel.app/)"
        date: 2023-05
        summary: Aplicación web en React que consume la PokéAPI para coleccionar cartas, persiste los resultados en el almacenamiento local del navegador y cuenta con navegación mediante React Router, notificaciones en tiempo real y diseño responsivo.
      - name: "[Panel de Gestión de Supermercado](https://github.com/hozlucas28/Codo-Codo-Back-end-Project-2022)"
        date: 2022-12
        summary: Panel que digitaliza la gestión de un supermercado, antes manual, mediante un CRUD completo en JSP y MySQL para empleados y productos, con filtros de búsqueda dinámicos, notificaciones en Bootstrap y validación de formularios.
