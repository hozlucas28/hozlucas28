        highlights:
          - Reduje riesgos técnicos en proyectos de Mercado Libre, logrando que **7** de **14** pull requests fueran integradas por sus equipos de ingeniería, al detectar y proponer proactivamente iniciativas de seguridad.
          - Desarrollé **+90** repositorios (**+4.600** contribuciones) y creé **+230** pull requests en GitHub, aplicando algoritmos y estructuras de datos en Go, TypeScript y Python, compartiendo mis conocimientos con la comunidad.
          - Incorporé herramientas de desarrollo asistido por IA para acelerar el ciclo de vida del software (SDLC), complementando su uso con certificaciones oficiales y aprendizaje continuo.
          - Redacté **6** artículos técnicos sobre prevención de ataques a la cadena de suministro, sistemas escalables, principios SOLID, patrones de diseño, CI/CD y DevContainers, implementando estas prácticas en mi flujo de trabajo del día a día.
